<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SlopCheck{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="/">
      <span class="brand-mark">✨</span>
      <span class="brand-name">Slop<span>Check</span></span>
    </a>
    <div class="nav-links">
      <a href="/">New check</a>
      <a href="/history">History</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
  <div class="footer">SlopCheck runs 100% locally — your code never leaves this machine.</div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
